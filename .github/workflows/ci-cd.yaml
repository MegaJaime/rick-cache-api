name: CI/CD Rick and Morty Pipelines

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: igorarizadevelop/rickandmorty:${{ github.sha }}

      - name: Update manifests repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|igorarizadevelop/rickandmorty:.*|igorarizadevelop/rickandmorty:${{ github.sha }}|" k8s/dev/deployment.yaml
          git add k8s/dev/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update image to ${{ github.sha }}"
          git push
